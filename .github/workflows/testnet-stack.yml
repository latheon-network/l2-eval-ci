name: testnet server stack (rehearsal)

# Manual only: spends a little Arbitrum Sepolia ETH from REHEARSAL_DEPLOYER_KEY.
# Runs the exact server procedure from testnet/ on a GitHub runner: setup, deploy-chain.sh,
# docker compose (node, explorer, HTTPS proxy), then checks the public endpoints the way a user would.
# The chain ends with the job.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rehearsal
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Latheon circuits (public repo, for the scenario)
        uses: actions/checkout@v4
        with:
          repository: latheon-network/Latheon
          ref: 180b4b8448939e3b3f3a61eabb003b84d2b9277c
          path: latheon
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Server setup (as on the server, without apt and firewall)
        working-directory: testnet
        env:
          PARENT_RPC_SECRET: ${{ secrets.ARB_SEPOLIA_RPC }}
        run: |
          if [ -z "${{ secrets.REHEARSAL_DEPLOYER_KEY }}" ]; then echo "::error::REHEARSAL_DEPLOYER_KEY is not set"; exit 1; fi
          cp .env.example .env
          sed -i 's|^RPC_HOST=.*|RPC_HOST=rpc.localhost|; s|^EXPLORER_HOST=.*|EXPLORER_HOST=explorer.localhost|' .env
          sed -i 's|^TLS_LINE=.*|TLS_LINE="tls internal"|; s|^NITRO_EXTRA_ARGS=.*|NITRO_EXTRA_ARGS=--ensure-rollup-deployment=false|; s|^BATCH_MAX_DELAY=.*|BATCH_MAX_DELAY=30s|' .env
          # validator: short confirm period (10 L1 blocks ~ 2 min) and latest instead of finalized parent blocks, CI only
          sed -i 's|^BOLD_FAST=.*|BOLD_FAST=1|; s|^CONFIRM_PERIOD_BLOCKS=.*|CONFIRM_PERIOD_BLOCKS=10|; s|^MIN_ASSERTION_PERIOD_BLOCKS=.*|MIN_ASSERTION_PERIOD_BLOCKS=5|' .env
          [ -n "$PARENT_RPC_SECRET" ] && sed -i "s|^PARENT_RPC=.*|PARENT_RPC=$PARENT_RPC_SECRET|" .env
          # pick the newest published image tags (Blockscout publishes public images manually, sometimes later than the git tag)
          pick() { for t in "${@:2}"; do if docker manifest inspect "$1:$t" > /dev/null 2>&1; then echo "$t"; return; fi; done; echo "none"; }
          BT=$(pick ghcr.io/blockscout/blockscout 9.0.2)
          FT=$(pick ghcr.io/blockscout/frontend v2.3.1)
          CT=$(pick caddy 2.11.7 2.11.6 2.11.5 2.11 2.10.2)
          echo "blockscout=$BT frontend=$FT caddy=$CT" | tee $GITHUB_WORKSPACE/image-tags.txt
          if [ "$BT" = none ] || [ "$FT" = none ] || [ "$CT" = none ]; then echo "::error::no published image tag found"; exit 1; fi
          sed -i "s|^BLOCKSCOUT_TAG=.*|BLOCKSCOUT_TAG=$BT|; s|^FRONTEND_TAG=.*|FRONTEND_TAG=$FT|; s|^CADDY_TAG=.*|CADDY_TAG=$CT|" .env
          sudo SKIP_PACKAGES=1 ./setup-server.sh

      - name: deploy-chain.sh (create chain, start stack, deposit, token bridge, batches)
        working-directory: testnet
        env:
          DEPLOYER_KEY: ${{ secrets.REHEARSAL_DEPLOYER_KEY }}
        run: |
          set -o pipefail
          sudo -E ./deploy-chain.sh 2>&1 | tee $GITHUB_WORKSPACE/deploy-log.txt
          sudo docker compose ps | tee $GITHUB_WORKSPACE/compose-ps.txt

      - name: Public RPC over HTTPS
        run: |
          set -o pipefail
          R() { curl -sk --resolve rpc.localhost:443:127.0.0.1 https://rpc.localhost -H 'content-type: application/json' --data "$1"; echo; }
          {
            echo "eth_chainId:";     R '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'
            echo "eth_blockNumber:"; R '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}'
            echo "debug_* must be unavailable:"; R '{"jsonrpc":"2.0","id":1,"method":"debug_traceBlockByNumber","params":["latest",{}]}'
          } | tee $GITHUB_WORKSPACE/rpc-check.txt
          grep -q '"result"' <(R '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}')
          ! grep -q '"result"' <(R '{"jsonrpc":"2.0","id":1,"method":"debug_traceBlockByNumber","params":["latest",{}]}')

      - name: Latheon scenario on the chain (traffic for the explorer)
        working-directory: arbitrum/l2-eval
        env:
          LATHEON_REPO: ${{ github.workspace }}/latheon
          LATHEON_EVAL_KEY: ${{ secrets.REHEARSAL_DEPLOYER_KEY }}
        run: |
          set -o pipefail
          npm install --no-audit --no-fund > /dev/null
          node eval.js rehearsal-l3 --fresh 2>&1 | tee $GITHUB_WORKSPACE/eval-stack.txt

      - name: Latheon contracts on the chain (latheon-cmd.sh deploy and smoke, as on the server)
        working-directory: testnet
        env:
          DEPLOYER_KEY: ${{ secrets.REHEARSAL_DEPLOYER_KEY }}
        run: |
          set -o pipefail
          { sudo -E ./latheon-cmd.sh deploy && sudo -E ./latheon-cmd.sh smoke; } 2>&1 | tee $GITHUB_WORKSPACE/latheon-contracts.txt
          sudo cp -f latheon/out/latheon-deployments.json latheon/out/latheon-smoke.json $GITHUB_WORKSPACE/ 2>/dev/null || true

      - name: Faucet (faucet-cmd.sh init and fund as on the server, then a claim over HTTPS like a user)
        working-directory: testnet
        env:
          DEPLOYER_KEY: ${{ secrets.REHEARSAL_DEPLOYER_KEY }}
        run: |
          set -o pipefail
          { sudo -E ./faucet-cmd.sh init && sudo -E ./faucet-cmd.sh fund 1000 && sudo -E ./faucet-cmd.sh address; } 2>&1 | tee $GITHUB_WORKSPACE/faucet.txt
          F() { curl -sk --resolve explorer.localhost:443:127.0.0.1 "https://explorer.localhost$1" "${@:2}"; }
          R() { curl -sk --resolve rpc.localhost:443:127.0.0.1 https://rpc.localhost -H 'content-type: application/json' --data "$1"; }
          for i in $(seq 1 30); do F /faucet/api/status | grep -q '"configured":true' && break; sleep 5; done
          A=0x$(openssl rand -hex 20)
          {
            echo "status: $(F /faucet/api/status)"
            echo "page HTTP status: $(F /faucet -o /dev/null -w '%{http_code}')"
            echo "claim for $A: $(F /faucet/api/claim -X POST -H 'content-type: application/json' --data "{\"address\":\"$A\"}")"
            echo "balance of $A: $(R "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getBalance\",\"params\":[\"$A\",\"latest\"]}")"
            echo "second claim HTTP status: $(F /faucet/api/claim -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data "{\"address\":\"0x$(openssl rand -hex 20)\"}")"
          } | tee -a $GITHUB_WORKSPACE/faucet.txt
          grep -q 'page HTTP status: 200' $GITHUB_WORKSPACE/faucet.txt
          grep -q '"status":"confirmed"' $GITHUB_WORKSPACE/faucet.txt
          grep -q '"result":"0x56bc75e2d63100000"' $GITHUB_WORKSPACE/faucet.txt   # exactly 100 LTH
          grep -q 'second claim HTTP status: 429' $GITHUB_WORKSPACE/faucet.txt     # same connection within 24 h

      - name: Validator and a withdrawal back to Arbitrum Sepolia (assertion posted and confirmed, outbox executed)
        working-directory: testnet
        env:
          DEPLOYER_KEY: ${{ secrets.REHEARSAL_DEPLOYER_KEY }}
          WITHDRAW_TIMEOUT_MIN: "50"
        run: |
          set -o pipefail
          { sudo -E ./chain-cmd.sh validator && sudo -E ./chain-cmd.sh withdraw && sudo -E ./chain-cmd.sh validator; } 2>&1 | tee $GITHUB_WORKSPACE/withdraw.txt

      - name: Explorer over HTTPS (API indexes the chain, web page loads)
        run: |
          E() { curl -sk --resolve explorer.localhost:443:127.0.0.1 "https://explorer.localhost$1"; }
          ok=""
          for i in $(seq 1 60); do
            n=$(E /api/v2/stats | python3 -c "import sys,json; print(json.load(sys.stdin).get('total_transactions','0'))" 2>/dev/null || echo 0)
            echo "indexed transactions: $n"
            if [ "${n:-0}" -ge 20 ] 2>/dev/null; then ok=1; break; fi
            sleep 10
          done
          { echo "stats:"; E /api/v2/stats; echo; echo "latest blocks:"; E '/api/v2/blocks' | cut -c1-1500; echo;
            echo "home page HTTP status: $(curl -sk -o /dev/null -w '%{http_code}' --resolve explorer.localhost:443:127.0.0.1 https://explorer.localhost/)"; } | tee $GITHUB_WORKSPACE/explorer-check.txt
          [ -n "$ok" ] && grep -q "home page HTTP status: 200" $GITHUB_WORKSPACE/explorer-check.txt

      - name: Stop, return leftover ETH, save public results
        if: always()
        env:
          DEPLOYER_KEY: ${{ secrets.REHEARSAL_DEPLOYER_KEY }}
          GH_TOKEN: ${{ github.token }}
        working-directory: testnet
        run: |
          sudo docker compose logs --no-color nitro 2>&1 | grep -v '^.*DEBUG' | tail -200 > /tmp/nitro-log.txt || true
          sudo docker compose logs --no-color nitro 2>&1 | grep -iE 'assertion|staker|bold|validat|confirm' | tail -150 > /tmp/validator-log.txt || true
          sudo docker compose logs --no-color blockscout frontend caddy faucet 2>&1 | tail -300 > /tmp/services-log.txt || true
          sudo docker compose down || true
          sudo test -f chain/secret/state.json && sudo -E ./chain-cmd.sh sweep 2>&1 | tee -a $GITHUB_WORKSPACE/deploy-log.txt || true
          mkdir -p /tmp/out
          cd $GITHUB_WORKSPACE
          cp -f image-tags.txt deploy-log.txt compose-ps.txt rpc-check.txt eval-stack.txt explorer-check.txt latheon-contracts.txt latheon-deployments.json latheon-smoke.json faucet.txt withdraw.txt /tmp/out/ 2>/dev/null || true
          cp -f /tmp/nitro-log.txt /tmp/validator-log.txt /tmp/services-log.txt /tmp/out/ 2>/dev/null || true
          sudo cp -f testnet/chain/out/chain.json /tmp/out/ 2>/dev/null || true
          sudo chown -R "$(id -u)" /tmp/out
          # scrub keys and secrets in case any tool printed them
          for k in $(sudo python3 -c "import json;d=json.load(open('testnet/chain/secret/state.json'));print(d.get('batchPosterKey',''),d.get('validatorKey',''))" 2>/dev/null) $(sudo cat testnet/faucet/secret/faucet.key 2>/dev/null) "$DEPLOYER_KEY"; do
            [ -n "$k" ] && sed -i "s/${k#0x}/<redacted>/gI" /tmp/out/* || true
          done
          for v in BS_DB_PASSWORD BS_SECRET_KEY_BASE; do
            val=$(sed -n "s/^$v=//p" testnet/.env); [ -n "$val" ] && sed -i "s/$val/<redacted>/g" /tmp/out/* || true
          done
          sed -i '/private-key\|privateKey/Id' /tmp/out/* || true
          cd /tmp && rm -rf res
          git clone -q --depth 1 --branch results "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" res
          cd res && git config user.name "latheon-network" && git config user.email "latheon.protocol@gmail.com"
          D="run-${{ github.run_id }}-testnet-stack"; mkdir -p "$D" && cp /tmp/out/* "$D/"
          git add "$D" && git commit -qm "testnet stack rehearsal, run ${{ github.run_id }}" && git push -q origin results
