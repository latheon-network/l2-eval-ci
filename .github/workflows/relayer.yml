name: testnet relayer

# Local test of the withdrawal relayer (testnet/relayer) with real withdraw_v3 and withdraw_v4 proofs against the native-coin pools and
# router from the Latheon repository, on ganache. No testnet funds are used.
on:
  workflow_dispatch:
  push:
    paths: ['testnet/relayer/**', '.github/workflows/relayer.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: latheon-network/Latheon
          ref: 53f3fa75e5ec9f3a329d8addd5f06a191faddc77
          path: latheon
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: testnet/relayer
        env:
          LATHEON_REPO: ${{ github.workspace }}/latheon
        run: |
          npm ci --no-audit --no-fund > /tmp/npm.txt 2>&1 || { echo "::error::npm ci failed: $(tail -5 /tmp/npm.txt | tr '\n' ' ')"; exit 1; }
          ls "$LATHEON_REPO/circuits/build/withdraw_v3/" || echo "::error::no withdraw_v3 build in the Latheon checkout"
          node test.js > /tmp/test.txt 2>&1; rc=$?; cat /tmp/test.txt
          [ $rc = 0 ] || echo "::error::test exit $rc: $(grep -v 'uws\|µWS\|Require stack\|^- ' /tmp/test.txt | tail -4 | tr '\n' ' ' | cut -c1-600)"
          [ $rc = 0 ] || exit $rc
          node test-faults.js > /tmp/faults.txt 2>&1; rc=$?; cat /tmp/faults.txt
          [ $rc = 0 ] || echo "::error::fault tests exit $rc: $(grep '^FAIL' /tmp/faults.txt | head -3 | tr '\n' ' ' | cut -c1-600)"
          exit $rc
