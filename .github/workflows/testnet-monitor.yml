name: testnet monitor

# Every 15 minutes, from outside the server: is the public test chain up (RPC, explorer, faucet page) and do the batch
# poster and validator still have ETH on Arbitrum Sepolia. Telegram messages in Russian (secrets TG_BOT_TOKEN and
# TG_CHAT_ID): when a problem appears or changes, a reminder every 2 hours while it lasts, and once when all is well
# again. The run fails while there is a problem. Scheduled runs can start late when GitHub is busy.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send the current summary to Telegram even if everything is fine'
        type: boolean
        default: false

concurrency:
  group: testnet-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: testnet/monitor
      - name: Previous state
        uses: actions/cache/restore@v4
        with:
          path: monitor-state
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-
      - name: Check the public endpoints
        id: check
        continue-on-error: true
        env:
          PROBLEMS_FILE: /tmp/problems.txt
          SUMMARY_FILE: /tmp/summary.txt
        run: testnet/monitor/check.sh
      - name: Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ steps.check.outcome }}
          TEST: ${{ inputs.test_alert }}
        run: |
          mkdir -p monitor-state
          prev=$(cat monitor-state/status 2>/dev/null || echo ok)
          prev_problems=$(cat monitor-state/problems 2>/dev/null || true)
          last_sent=$(cat monitor-state/last_sent 2>/dev/null || echo 0)
          now_s=$(date +%s); when=$(TZ=Europe/Moscow date '+%d.%m %H:%M МСК')
          problems=$(cat /tmp/problems.txt 2>/dev/null || true); summary=$(cat /tmp/summary.txt 2>/dev/null || true)
          [ "$OUTCOME" = success ] && status=ok || status=fail
          [ "$status" = fail ] && [ -z "$problems" ] && problems="• проверка не выполнилась, см. запуск"
          text=""
          if [ "$status" = fail ]; then
            if [ "$prev" != fail ] || [ "$problems" != "$prev_problems" ]; then
              text=$(printf '🔴 Latheon testnet: проблема\n\n%s\n\n%s\n%s' "$problems" "$when" "$RUN_URL")
            elif [ $((now_s - last_sent)) -ge 7200 ]; then
              text=$(printf '🔴 Latheon testnet: проблема всё ещё есть\n\n%s\n\n%s\n%s' "$problems" "$when" "$RUN_URL")
            fi
          elif [ "$prev" = fail ]; then
            text=$(printf '🟢 Latheon testnet: снова всё работает\n\n%s\n\n%s' "$summary" "$when")
          fi
          if [ -z "$text" ] && [ "$TEST" = true ]; then
            [ "$status" = ok ] && text=$(printf '✅ Latheon testnet: всё работает (проверка по запросу)\n\n%s\n\n%s' "$summary" "$when") \
                               || text=$(printf '🔴 Latheon testnet: проблема (проверка по запросу)\n\n%s\n\n%s\n%s' "$problems" "$when" "$RUN_URL")
          fi
          if [ -n "$text" ]; then
            if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
              curl -s -m 20 -o /dev/null -w 'telegram HTTP %{http_code}\n' "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TG_CHAT_ID}" --data-urlencode "text=${text}" --data-urlencode "disable_web_page_preview=true"
              echo "$now_s" > monitor-state/last_sent
            else
              echo "Telegram secrets not set"; printf '%s\n' "$text"
            fi
          fi
          echo "$status" > monitor-state/status; printf '%s' "$problems" > monitor-state/problems
          [ -f monitor-state/last_sent ] || echo 0 > monitor-state/last_sent
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: monitor-state
          key: monitor-state-${{ github.run_id }}
      - name: Fail while there is a problem
        if: steps.check.outcome != 'success'
        run: exit 1
