<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latheon Testnet Faucet</title>
<style>
  :root { --bg: #0d0f14; --panel: #161a22; --line: #262c38; --text: #e7eaf0; --muted: #9aa3b2; --accent: #5dcaa5; --err: #f08a7e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: 15px ui-monospace, Menlo, Consolas, monospace; }
  .row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  button { padding: 11px 16px; border-radius: 8px; border: 0; background: var(--accent); color: #062018; font-weight: 600; font-size: 15px; cursor: pointer; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { margin-top: 16px; min-height: 24px; word-break: break-all; }
  #msg.err { color: var(--err); }
  a { color: var(--accent); }
  .facts { margin-top: 20px; font-size: 14px; color: var(--muted); }
  .facts div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); }
  .facts span:last-child { color: var(--text); text-align: right; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>Latheon Testnet Faucet</h1>
  <p>Test LTH for the Latheon test chain. LTH pays for gas there and is what the test pools hold. It has no value.</p>
  <div class="panel">
    <label for="addr">Your address</label>
    <input id="addr" placeholder="0x…" autocomplete="off" spellcheck="false">
    <div class="row">
      <button id="claim">Get test LTH</button>
      <button id="wallet" class="secondary">Use my wallet</button>
      <button id="addnet" class="secondary">Add network to wallet</button>
    </div>
    <div id="msg"></div>
  </div>
  <div class="facts" id="facts"></div>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var info = null;
  function say(text, isErr, html) { var m = $('msg'); m.className = isErr ? 'err' : ''; if (html) m.innerHTML = html; else m.textContent = text; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function facts() {
    var rows = [];
    if (!info.configured) rows.push(['Status', 'not configured yet']);
    rows.push(['Per claim', info.amount + ' LTH']);
    rows.push(['Limit', 'one claim per address and per connection every ' + info.cooldownHours + ' h']);
    if (info.chainId) rows.push(['Chain ID', String(info.chainId)]);
    if (info.balance) rows.push(['Faucet balance', Number(info.balance).toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' LTH']);
    if (info.rpc) rows.push(['RPC', info.rpc]);
    $('facts').innerHTML = rows.map(function (r) { return '<div><span>' + esc(r[0]) + '</span><span>' + esc(r[1]) + '</span></div>'; }).join('');
  }
  fetch('/faucet/api/status').then(function (r) { return r.json(); }).then(function (s) { info = s; facts(); $('addnet').disabled = !(s.chainId && s.rpc); })
    .catch(function () { say('The faucet is not reachable right now.', true); });
  if (!window.ethereum) { $('wallet').disabled = true; $('addnet').disabled = true; }

  $('wallet').onclick = function () {
    window.ethereum.request({ method: 'eth_requestAccounts' }).then(function (a) { if (a && a[0]) $('addr').value = a[0]; })
      .catch(function (e) { say((e && e.message) || 'The wallet refused.', true); });
  };
  $('addnet').onclick = function () {
    if (!info || !info.chainId) return;
    var p = { chainId: '0x' + info.chainId.toString(16), chainName: 'Latheon Testnet', rpcUrls: [info.rpc],
      nativeCurrency: { name: 'LTH (test)', symbol: 'LTH', decimals: 18 } };
    if (info.explorer) p.blockExplorerUrls = [info.explorer];
    window.ethereum.request({ method: 'wallet_addEthereumChain', params: [p] }).then(function () { say('Network added.'); })
      .catch(function (e) { say((e && e.message) || 'The wallet refused.', true); });
  };
  $('claim').onclick = function () {
    var a = $('addr').value.trim();
    if (!/^0x[0-9a-fA-F]{40}$/.test(a)) { say('Enter an address: 0x and 40 hex characters.', true); return; }
    $('claim').disabled = true; say('Sending…');
    fetch('/faucet/api/claim', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ address: a }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) {
        if (!x.ok) {
          var t = x.j.error || 'Refused.';
          if (x.j.retryAfterSeconds) t += ' Next claim in about ' + Math.ceil(x.j.retryAfterSeconds / 3600) + ' h.';
          say(t, true); return;
        }
        var link = x.j.explorer ? ' <a href="' + esc(x.j.explorer) + '" target="_blank" rel="noopener">View transaction</a>' : ' ' + esc(x.j.txHash);
        say('', false, esc(x.j.amount) + ' LTH sent (' + esc(x.j.status) + ').' + link);
      })
      .catch(function () { say('The faucet is not reachable right now.', true); })
      .then(function () { $('claim').disabled = false; });
  };
})();
</script>
</body>
</html>
