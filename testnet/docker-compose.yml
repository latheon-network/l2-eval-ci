# Latheon testnet server: L3 node, public RPC and block explorer behind HTTPS.
# Values come from .env (copy .env.example, run ./setup-server.sh) and chain/out/chain.env (written by deploy).

name: latheon-testnet

services:
  nitro:
    image: ${NITRO_IMAGE}
    restart: unless-stopped
    command: --conf.file /config/node-config.json ${NITRO_EXTRA_ARGS:-}
    volumes:
      - nitro-data:/home/user/.arbitrum
      - ./chain/secret/node-config.json:/config/node-config.json:ro
    ports:
      - "127.0.0.1:8449:8449"   # local scripts on the server; the public reaches it through Caddy only
    stop_grace_period: 2m

  db:
    image: postgres:17
    restart: unless-stopped
    shm_size: 256m
    environment:
      POSTGRES_DB: blockscout
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: ${BS_DB_PASSWORD}
    volumes:
      - blockscout-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout -d blockscout"]
      interval: 10s
      timeout: 5s
      retries: 10

  blockscout:
    image: ghcr.io/blockscout/blockscout:${BLOCKSCOUT_TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      nitro:
        condition: service_started
    command: sh -c 'bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()" && bin/blockscout start'
    environment:
      DATABASE_URL: postgresql://blockscout:${BS_DB_PASSWORD}@db:5432/blockscout
      ECTO_SSL_MODE: disable
      ECTO_USE_SSL: "false"
      SECRET_KEY_BASE: ${BS_SECRET_KEY_BASE}
      ETHEREUM_JSONRPC_VARIANT: geth
      ETHEREUM_JSONRPC_TRANSPORT: http
      ETHEREUM_JSONRPC_HTTP_URL: http://nitro:8449/
      ETHEREUM_JSONRPC_TRACE_URL: http://nitro:8449/
      ETHEREUM_JSONRPC_DISABLE_ARCHIVE_BALANCES: "false"
      CHAIN_ID: ${CHAIN_ID}
      COIN: LTH
      COIN_NAME: LTH (test)
      PORT: "4000"
      DISABLE_MARKET: "true"
      ACCOUNT_ENABLED: "false"
      # debug_* is not exposed by the node, so no internal-transaction tracing on this testnet
      INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: "true"
      INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "true"
      MICROSERVICE_SC_VERIFIER_ENABLED: "false"
      MICROSERVICE_VISUALIZE_SOL2UML_ENABLED: "false"
      MICROSERVICE_SIG_PROVIDER_ENABLED: "false"
      API_V1_READ_METHODS_DISABLED: "false"
      API_V1_WRITE_METHODS_DISABLED: "false"
      DISABLE_FILE_LOGGING: "true"

  frontend:
    image: ghcr.io/blockscout/frontend:${FRONTEND_TAG}
    restart: unless-stopped
    depends_on:
      - blockscout
    environment:
      NEXT_PUBLIC_API_HOST: ${EXPLORER_HOST}
      NEXT_PUBLIC_API_PROTOCOL: https
      NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL: wss
      NEXT_PUBLIC_API_BASE_PATH: /
      NEXT_PUBLIC_APP_HOST: ${EXPLORER_HOST}
      NEXT_PUBLIC_APP_PROTOCOL: https
      NEXT_PUBLIC_NETWORK_NAME: Latheon Testnet
      NEXT_PUBLIC_NETWORK_SHORT_NAME: Latheon Testnet
      NEXT_PUBLIC_NETWORK_ID: ${CHAIN_ID}
      NEXT_PUBLIC_NETWORK_RPC_URL: https://${RPC_HOST}
      NEXT_PUBLIC_NETWORK_CURRENCY_NAME: LTH (test)
      NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: LTH
      NEXT_PUBLIC_NETWORK_CURRENCY_DECIMALS: "18"
      NEXT_PUBLIC_IS_TESTNET: "true"
      NEXT_PUBLIC_HOMEPAGE_CHARTS: "[]"
      # branding: files in brand/ served by Caddy at /brand/
      NEXT_PUBLIC_NETWORK_LOGO: https://${EXPLORER_HOST}/brand/logo-light.png
      NEXT_PUBLIC_NETWORK_LOGO_DARK: https://${EXPLORER_HOST}/brand/logo-dark.png
      NEXT_PUBLIC_NETWORK_ICON: https://${EXPLORER_HOST}/brand/icon-light.png
      NEXT_PUBLIC_NETWORK_ICON_DARK: https://${EXPLORER_HOST}/brand/icon.png
      FAVICON_MASTER_URL: https://${EXPLORER_HOST}/brand/icon.png
      NEXT_PUBLIC_OG_IMAGE_URL: https://${EXPLORER_HOST}/brand/og.png
      NEXT_PUBLIC_OG_DESCRIPTION: "Explorer of the Latheon test chain, an Arbitrum Orbit chain on Arbitrum Sepolia with test LTH as gas. Testnet only, no audit."
      NEXT_PUBLIC_PROMOTE_BLOCKSCOUT_IN_TITLE: "false"
      NEXT_PUBLIC_COLOR_THEME_DEFAULT: dark
      NEXT_PUBLIC_HOMEPAGE_HERO_BANNER_CONFIG: '{"background":["linear-gradient(135deg, #14121C 0%, #2A2360 55%, #0F6E56 100%)"],"text_color":["#F2EFE9"],"border":["1px solid #534AB7"],"button":{"_default":{"background":["#0F6E56"],"text_color":["#F2EFE9"]},"_hover":{"background":["#5DCAA5"],"text_color":["#14121C"]},"_selected":{"background":["#534AB7"],"text_color":["#F2EFE9"]}}}'
      NEXT_PUBLIC_MAINTENANCE_ALERT_MESSAGE: 'Test network. Test LTH has no value, no audit. <a href="https://${EXPLORER_HOST}/faucet">Faucet</a> · <a href="https://latheon.xyz/demo">Demo</a>'
      NEXT_PUBLIC_FOOTER_LINKS: '[{"title":"Latheon","links":[{"text":"Website","url":"https://latheon.xyz"},{"text":"Demo","url":"https://latheon.xyz/demo"},{"text":"Faucet","url":"https://${EXPLORER_HOST}/faucet"}]},{"title":"Developers","links":[{"text":"GitHub","url":"https://github.com/latheon-network/Latheon"},{"text":"Testnet guide","url":"https://github.com/latheon-network/Latheon/blob/main/docs/testnet.md"},{"text":"Threat model","url":"https://github.com/latheon-network/Latheon/blob/main/THREAT-MODEL.md"}]},{"title":"Community","links":[{"text":"X","url":"https://x.com/Latheon_xyz"}]}]'
      NEXT_PUBLIC_OTHER_LINKS: '[{"url":"https://${EXPLORER_HOST}/faucet","text":"Faucet (test LTH)"},{"url":"https://latheon.xyz/demo","text":"Latheon demo"},{"url":"https://github.com/latheon-network/Latheon/blob/main/docs/testnet.md","text":"Testnet guide"}]'

  faucet:
    # Test LTH for new addresses: https://EXPLORER_HOST/faucet. Its key is created by ./faucet-cmd.sh init and funded by
    # ./faucet-cmd.sh fund AMOUNT; until then the page says "not configured". Not published: Caddy is the only way in.
    image: node:22-bookworm-slim
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /faucet
    command: sh -c 'npm ci --omit=dev --no-audit --no-fund --cache /tmp/npm >/dev/null 2>&1 && exec node server.js'
    depends_on:
      - nitro
    environment:
      L3_RPC: http://nitro:8449
      PUBLIC_RPC: https://${RPC_HOST}
      EXPLORER_URL: https://${EXPLORER_HOST}
      FAUCET_AMOUNT: ${FAUCET_AMOUNT:-100}
      FAUCET_COOLDOWN_HOURS: ${FAUCET_COOLDOWN_HOURS:-24}
      FAUCET_DAILY_CAP: ${FAUCET_DAILY_CAP:-5000}
    volumes:
      - ./faucet:/faucet

  relayer:
    # Withdrawal relayer: https://EXPLORER_HOST/relay/api/ submits withdrawals so an empty address can receive without gas.
    # Own key (./relayer-cmd.sh init), funded with LTH (./relayer-cmd.sh fund AMOUNT); only our pools and router.
    image: node:22-bookworm-slim
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /relayer
    command: sh -c 'npm ci --omit=dev --no-audit --no-fund --cache /tmp/npm >/dev/null 2>&1 && exec node relayer.js serve'
    depends_on:
      - nitro
    environment:
      L3_RPC: http://nitro:8449
      LATHEON_JSON: /latheon-out/latheon-deployments.json
      PORT: "8090"
      RELAY_PER_IP_HOUR: ${RELAY_PER_IP_HOUR:-10}
      RELAY_DAILY_CAP: ${RELAY_DAILY_CAP:-500}
    volumes:
      - ./relayer:/relayer
      - ./latheon/out:/latheon-out:ro

  bot:
    # Telegram bot for the operator (/status, /menu with confirmed actions) in the chat TG_CHAT_ID, and the writer of the
    # dashboard data. Actions run through ops-runner.sh on the host (install once: ./ops-install.sh).
    # Long polling, no open port, no keys of the chain: reads the public out/ files and asks the services directly.
    image: node:22-bookworm-slim
    restart: unless-stopped
    user: "1000:1000"
    command: node /bot/bot.js
    depends_on:
      - nitro
    environment:
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      TG_CHAT_ID: ${TG_CHAT_ID:-}
      L3_RPC: http://nitro:8449
      PARENT_RPC: ${PARENT_RPC:-https://sepolia-rollup.arbitrum.io/rpc}
      RPC_HOST: ${RPC_HOST}
      EXPLORER_HOST: ${EXPLORER_HOST}
    volumes:
      - ./bot:/bot:ro
      - ./chain/out:/chain-out:ro
      - ./latheon/out:/latheon-out:ro
      - ./ops-queue:/ops-queue        # requests to ops-runner.sh (host, systemd) and its answers
      - ./ops-data:/ops-data          # public snapshot for the dashboard at /ops/

  caddy:
    # Caddy plus the rate_limit module (caddy/Dockerfile); limits per IP are set in Caddyfile and .env
    build:
      context: ./caddy
      args:
        CADDY_TAG: ${CADDY_TAG}
    image: latheon-caddy:${CADDY_TAG}-ratelimit
    restart: unless-stopped
    depends_on:
      - nitro
      - frontend
      - faucet
      - relayer
    ports:
      - "80:80"
      - "443:443"
    environment:
      RPC_HOST: ${RPC_HOST}
      EXPLORER_HOST: ${EXPLORER_HOST}
      TLS_LINE: ${TLS_LINE:-}
      RPC_RATE_PER_SECOND: ${RPC_RATE_PER_SECOND:-25}
      RPC_RATE_PER_MINUTE: ${RPC_RATE_PER_MINUTE:-600}
      API_RATE_PER_SECOND: ${API_RATE_PER_SECOND:-40}
      API_RATE_PER_MINUTE: ${API_RATE_PER_MINUTE:-1200}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./ops:/srv/ops:ro
      - ./brand:/srv/brand:ro
      - ./ops-data:/srv/ops-data:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  nitro-data:
  blockscout-db:
  caddy-data:
  caddy-config:
